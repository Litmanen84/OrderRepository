## DATABASE
spring.datasource.url=jdbc:h2:mem:orderproject-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS orderproject
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## FLYWAY
spring.flyway.enabled=true
spring.flyway.default-schema=orderproject
spring.flyway.schemas=orderproject
spring.flyway.locations=classpath:db/migration

## JPA / HIBERNATE
spring.jpa.properties.hibernate.default_schema=orderproject
spring.jpa.hibernate.ddl-auto=validate