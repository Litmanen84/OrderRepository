spring.application.name=OrderProject

##LOGGING
logging.file.name=logs/orders.log
logging.level.root=WARN
logging.level.com.example.orderproject=WARN

##DB_SETTINGS
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.default-schema=orderproject
spring.flyway.schemas=orderproject
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.default_schema=orderproject


##Flyway owns the schema; Hibernate only checks it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate